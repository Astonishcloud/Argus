name: Build Argus Windows Installer

# 在 macOS / Linux 上无法交叉编译出可用的 Windows 安装包
# （桌面端依赖原生模块 node-pty，需要 Windows 平台的 .node 二进制）。
# 因此用 GitHub 的 windows-latest Runner 自动出包。
#
# 触发方式：
#   1) 手动：仓库 → Actions → 本工作流 → Run workflow（只产出 Artifacts，供临时下载）
#   2) 打 tag：push 以 v 开头的 tag（如 v0.2.0）自动触发，并自动创建 / 更新 GitHub Release
#
# 产物去哪：
#   - 手动运行 → Actions 运行页底部 Artifacts 下载 `argus-windows-installer`（zip，保留 90 天）
#   - tag 运行 → 仓库 Releases 页出现带 .exe 的 Release（永久保留）

# 发 Release 需要写权限（GITHUB_TOKEN 默认只读，必须显式授权）
permissions:
  contents: write

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

# 同一个 ref 上连续推送时，取消上一次还在跑的构建，省 runner 时间
concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python (node-gyp 编译 node-pty 需要)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # GitHub 的 Runner 在海外，走 npmmirror 反而绕远，默认不开。
      # 只有当 Electron / NSIS 二进制下载卡住时才取消注释：
      # - name: Set mirrors
      #   run: |
      #     npm config set registry https://registry.npmmirror.com
      #     echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $env:GITHUB_ENV
      #     echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $env:GITHUB_ENV

      # 必须从仓库根安装（assert-root-install.cjs 会校验），且不能加 --workspace
      - name: Install workspace deps (compiles node-pty)
        run: npm ci

      # 安装包文件名里的版本号取自 apps/desktop/package.json，而不是 tag。
      # 不同步的话，打 v0.2.0 仍然会产出 Argus-0.1.0-win-x64.exe。
      # 这步必须放在 npm ci 之后：提前改 package.json 会让 npm ci 的 lockfile 校验失败。
      - name: Sync desktop version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node -e "const f='apps/desktop/package.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f,'utf8'));j.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');console.log('desktop version ->',j.version)"

      - name: Build Windows NSIS installer
        run: cd apps\desktop; npm run dist:win:nsis

      # 始终上传 Artifacts（手动运行也能拿到，保留 90 天）
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: argus-windows-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
          if-no-files-found: error

      # 自动发 Release：仅在推送 v* tag 时执行（手动运行只产出 Artifacts）
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Argus ${{ github.ref_name }}
          # 只挂安装器和它的 blockmap（增量更新用），不再把 builder-debug.yml 传上去
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
          generate_release_notes: true
          # draft: true       # 想先存草稿再手动发布就打开
          # prerelease: true  # 想标记为预发布就打开
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
